<body>
  <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
    <h2>Redirecionando para o nosso WhatsApp...</h2>
    <p>Se você não for redirecionado em alguns segundos, <a id="linkManual" href="#">clique aqui</a>.</p>
  </div>

  <script>
    const vendedores = [
      "556236700183",
      "556293014883",
      "556293027383",
      "556294412238"
    ];

    const mensagem = encodeURIComponent("Olá! Vim do Instagram e gostaria de fazer um orçamento.");

    let index = localStorage.getItem("wppIndex") || 0;
    const numero = vendedores[index];
    const url = `https://wa.me/${numero}?text=${mensagem}`;

    index = (Number(index) + 1) % vendedores.length;
    localStorage.setItem("wppIndex", index);

    // Configura o link manual caso o redirecionamento automático trave
    document.getElementById("linkManual").href = url;

    // Redireciona
    window.location.href = url;
  </script>
</body>
